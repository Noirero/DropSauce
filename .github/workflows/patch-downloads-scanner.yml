name: Patch downloads scanner

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-downloads-scanner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch local manga scanner
        run: python3 .github/scripts/patch_downloads_scanner.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/kotlin/org/koitharu/kotatsu/local/data/LocalMangaRepository.kt
          git rm --ignore-unmatch .github/workflows/patch-downloads-scanner.yml .github/scripts/patch_downloads_scanner.py
          git commit -m "Scan manga and novels under downloads folder"
          git push
