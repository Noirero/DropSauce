name: Source Fix Once

# Temporary source-only verification helper. It restores itself to manual-only in the commit it creates.
on:
  push:
    branches:
      - beta

permissions:
  contents: write

jobs:
  patch:
    name: Patch and verify source
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout beta
        uses: actions/checkout@v5
        with:
          ref: beta
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply source fixes
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def require_replace(text: str, old: str, new: str, label: str, expected: int = 1) -> str:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} occurrence(s), found {count}")
              return text.replace(old, new)

          # 1) Extension Store language inventory and matching.
          path = Path('app/src/main/kotlin/org/koitharu/kotatsu/settings/sources/catalog/SourcesCatalogViewModel.kt')
          text = path.read_text()
          text = require_replace(
              text,
              'import org.koitharu.kotatsu.extensions.runtime.getExternalExtensionLanguageDisplayName\n',
              'import org.koitharu.kotatsu.extensions.runtime.getExternalExtensionLangCode\n'
              'import org.koitharu.kotatsu.extensions.runtime.getExternalExtensionLanguageDisplayName\n',
              'language normalizer import',
          )
          text = require_replace(
              text,
              '\tprivate val availableRepoEntries = MutableStateFlow<List<ExternalExtensionRepoEntry>>(emptyList())\n',
              '',
              'obsolete per-page language cache',
          )
          start = text.index('\tval locales: StateFlow<Set<String?>> = combine(')
          end = text.index('\n\n\tval contentTypes:', start)
          locales_block = '''\tval locales: StateFlow<Set<String?>> = combine(
          \tallMihonSources,
          \tstoreManager.states,
          \tisNsfwDisabled,
          \trefreshTrigger,
          ) { sources, storeStates, nsfwDisabled, _ ->
          \tval localeSet = LinkedHashSet<String?>()
          \tsources.forEach { localeSet.addCatalogLanguage(it.language) }
          \tfor (state in storeStates) {
          \t\tfor (entry in state.catalog) {
          \t\t\tif (nsfwDisabled && entry.isNsfw != 0) continue
          \t\t\tlocaleSet.addCatalogLanguage(entry.lang)
          \t\t\tentry.sources.forEach { localeSet.addCatalogLanguage(it.lang) }
          \t\t}
          \t}
          \tlnPluginManager.getAll().forEach { localeSet.addCatalogLanguage(it.plugin.langCode) }
          \tlocaleSet.add(null)
          \tlocaleSet
          }.stateIn(viewModelScope + Dispatchers.Default, SharingStarted.Eagerly, defaultLocales)'''.replace('          ', '')
          text = text[:start] + locales_block + text[end:]

          cache_assignment = '\t\tavailableRepoEntries.value = available\n'
          cache_count = text.count(cache_assignment)
          if cache_count != 2:
              raise SystemExit(f'per-page language cache assignments: expected 2, found {cache_count}')
          text = text.replace(cache_assignment, '')

          old_entry_filter = 'if (locale != null && entry.lang != locale) continue'
          entry_filter_count = text.count(old_entry_filter)
          if entry_filter_count < 2:
              raise SystemExit(f'entry language filters: expected at least 2, found {entry_filter_count}')
          text = text.replace(
              old_entry_filter,
              'if (!extensionEntryMatchesLanguage('
              'entry, allInstalledSourcesByPkg[entry.packageName] ?: installedSourcesByPkg[entry.packageName], locale)) continue',
          )

          old_plugin_filter = 'if (filter.locale != null && plugin.langCode != filter.locale) continue'
          plugin_filter_count = text.count(old_plugin_filter)
          if plugin_filter_count < 2:
              raise SystemExit(f'plugin language filters: expected at least 2, found {plugin_filter_count}')
          text = text.replace(
              old_plugin_filter,
              'if (filter.locale != null && !extensionLanguageMatches(plugin.langCode, filter.locale)) continue',
          )

          helper_start = text.index('internal fun installedExtensionMatchesLanguage(')
          helper_end = text.index('\nprivate fun sameLanguageCode', helper_start)
          helpers = '''private val NON_FILTER_LANGUAGE_CODES = setOf("all", "mul", "other", "none", "und")

          private fun MutableSet<String?>.addCatalogLanguage(language: String?) {
          \tval normalized = language?.let(::getExternalExtensionLangCode)?.takeIf { it.isNotBlank() } ?: return
          \tif (normalized.lowercase() in NON_FILTER_LANGUAGE_CODES) return
          \tadd(normalized)
          }

          internal fun installedExtensionMatchesLanguage(
          \tsources: List<org.koitharu.kotatsu.mihon.model.MihonMangaSource>?,
          \tfallbackLanguage: String,
          \tselectedLanguage: String?,
          ): Boolean {
          \tif (selectedLanguage == null) return true
          \treturn if (sources.isNullOrEmpty()) {
          \t\textensionLanguageMatches(fallbackLanguage, selectedLanguage)
          \t} else {
          \t\tsources.any { extensionLanguageMatches(it.language, selectedLanguage) }
          \t}
          }

          internal fun extensionEntryMatchesLanguage(
          \tentry: ExternalExtensionRepoEntry,
          \tinstalledSources: List<org.koitharu.kotatsu.mihon.model.MihonMangaSource>?,
          \tselectedLanguage: String?,
          ): Boolean {
          \tif (selectedLanguage == null) return true
          \tif (installedSources.orEmpty().any { extensionLanguageMatches(it.language, selectedLanguage) }) return true
          \tif (entry.sources.any { source -> source.lang?.let { extensionLanguageMatches(it, selectedLanguage) } == true }) return true
          \treturn entry.lang?.let { extensionLanguageMatches(it, selectedLanguage) } == true
          }

          private fun extensionLanguageMatches(candidate: String, selected: String): Boolean {
          \tval normalizedCandidate = getExternalExtensionLangCode(candidate)
          \tval normalizedSelected = getExternalExtensionLangCode(selected)
          \tif (normalizedCandidate.equals("all", ignoreCase = true) || normalizedCandidate.equals("mul", ignoreCase = true)) {
          \t\treturn true
          \t}
          \treturn normalizedCandidate.equals(normalizedSelected, ignoreCase = true)
          }
'''.replace('          ', '')
          text = text[:helper_start] + helpers + text[helper_end:]
          path.write_text(text)

          # 2) Avoid GROUP BY for a concrete category: (manga_id, category_id) is already the PK.
          path = Path('app/src/main/kotlin/org/koitharu/kotatsu/favourites/data/FavouritesDao.kt')
          text = path.read_text()
          text = require_replace(
              text,
              '\t\t\t.filters(filterOptions)\n\t\t\t.groupBy("favourites.manga_id")\n\t\t\t.orderBy(getOrderBy(order, pinned))',
              '\t\t\t.filters(filterOptions)\n\t\t\t.apply {\n\t\t\t\tif (categoryId == 0L) {\n\t\t\t\t\tgroupBy("favourites.manga_id")\n\t\t\t\t}\n\t\t\t}\n\t\t\t.orderBy(getOrderBy(order, pinned))',
              'conditional favourites grouping',
          )
          path.write_text(text)

          # 3) Add lightweight chapter aggregate queries for Favourite card metadata.
          path = Path('app/src/main/kotlin/org/koitharu/kotatsu/core/db/dao/ChaptersDao.kt')
          text = path.read_text()
          marker = '@Dao\nabstract class ChaptersDao {'
          projections = '''data class ChapterLogicalCount(
          \tval mangaId: Long,
          \tval chapterCount: Int,
          )

          data class ChapterUnreadAfterCurrent(
          \tval mangaId: Long,
          \tval chapterId: Long,
          \tval unreadCount: Int,
          )

          @Dao
          abstract class ChaptersDao {'''.replace('          ', '')
          text = require_replace(text, marker, projections, 'chapter aggregate projections')
          find_all = '''\t@Query("SELECT * FROM chapters WHERE manga_id IN (:mangaIds) ORDER BY manga_id, `index` ASC")
          \tabstract suspend fun findAll(mangaIds: Collection<Long>): List<ChapterEntity>
'''.replace('          ', '')
          aggregate_queries = find_all + '''
          \t@Query(
          \t\t"""
          \t\tSELECT manga_id AS mangaId, MAX(branch_count) AS chapterCount
          \t\tFROM (
          \t\t\tSELECT manga_id, branch, COUNT(*) AS branch_count
          \t\t\tFROM chapters
          \t\t\tWHERE manga_id IN (:mangaIds)
          \t\t\tGROUP BY manga_id, branch
          \t\t) AS branch_counts
          \t\tGROUP BY manga_id
          \t\t""",
          \t)
          \tabstract suspend fun findLogicalCounts(mangaIds: Collection<Long>): List<ChapterLogicalCount>

          \t@Query(
          \t\t"""
          \t\tSELECT current.manga_id AS mangaId,
          \t\t\tcurrent.chapter_id AS chapterId,
          \t\t\t(
          \t\t\t\tSELECT COUNT(*)
          \t\t\t\tFROM chapters AS candidate
          \t\t\t\tWHERE candidate.manga_id = current.manga_id
          \t\t\t\t\tAND candidate.branch IS current.branch
          \t\t\t\t\tAND candidate.`index` > current.`index`
          \t\t\t) AS unreadCount
          \t\tFROM chapters AS current
          \t\tWHERE current.manga_id IN (:mangaIds)
          \t\t\tAND current.chapter_id IN (:chapterIds)
          \t\t""",
          \t)
          \tabstract suspend fun findUnreadAfterCurrent(
          \t\tmangaIds: Collection<Long>,
          \t\tchapterIds: Collection<Long>,
          \t): List<ChapterUnreadAfterCurrent>
'''.replace('          ', '')
          text = require_replace(text, find_all, aggregate_queries, 'chapter aggregate queries')
          path.write_text(text)

          # 4) Use those aggregate queries before the first Favourite cards are emitted.
          path = Path('app/src/main/kotlin/org/koitharu/kotatsu/favourites/domain/FavouriteUnreadCounter.kt')
          text = path.read_text()
          text = require_replace(
              text,
              'import org.koitharu.kotatsu.core.db.entity.ChapterEntity\n',
              '',
              'unused full chapter entity import',
          )
          start = text.index('\tsuspend fun getSnapshot(')
          end = text.index('\n\tprivate companion object {', start)
          implementation = '''\tsuspend fun getSnapshot(mangaIds: Collection<Long>, includeUnread: Boolean): Snapshot {
          \t\tif (mangaIds.isEmpty()) return Snapshot(emptyMap(), emptyMap())
          \t\tval ids = mangaIds.distinct()
          \t\tval historyDao = database.getHistoryDao()
          \t\tval histories = ids.chunked(DB_QUERY_BATCH_SIZE)
          \t\t\t.flatMap { historyDao.findByIds(it) }
          \t\t\t.associateBy { it.mangaId }
          \t\tif (!includeUnread) return Snapshot(histories, emptyMap())

          \t\tval chaptersDao = database.getChaptersDao()
          \t\tval logicalCounts = ids.chunked(DB_QUERY_BATCH_SIZE)
          \t\t\t.flatMap { chaptersDao.findLogicalCounts(it) }
          \t\t\t.associate { it.mangaId to it.chapterCount }
          \t\tval exactUnread = histories.values
          \t\t\t.chunked(DB_HISTORY_QUERY_BATCH_SIZE)
          \t\t\t.flatMap { chunk ->
          \t\t\t\tchaptersDao.findUnreadAfterCurrent(
          \t\t\t\t\tmangaIds = chunk.map { it.mangaId },
          \t\t\t\t\tchapterIds = chunk.map { it.chapterId },
          \t\t\t\t)
          \t\t\t}
          \t\t\t.associateBy { it.mangaId to it.chapterId }

          \t\tval unread = HashMap<Long, Int>(ids.size)
          \t\tfor (mangaId in ids) {
          \t\t\tval logicalCount = logicalCounts[mangaId] ?: 0
          \t\t\tval history = histories[mangaId]
          \t\t\tunread[mangaId] = when {
          \t\t\t\thistory == null -> logicalCount
          \t\t\t\tlogicalCount <= 0 -> 0
          \t\t\t\telse -> exactUnread[mangaId to history.chapterId]?.unreadCount
          \t\t\t\t\t?: calculateFallbackUnread(logicalCount, history)
          \t\t\t}
          \t\t}
          \t\treturn Snapshot(histories, unread)
          \t}

          \tsuspend fun getUnreadCount(mangaId: Long): Int =
          \t\tgetSnapshot(listOf(mangaId), includeUnread = true).unreadCounts[mangaId] ?: 0

          \tprivate fun calculateFallbackUnread(logicalCount: Int, history: HistoryEntity): Int {
          \t\tval total = history.chaptersCount.takeIf { it > 0 } ?: logicalCount
          \t\tif (total <= 0) return 0
          \t\tval read = ceil(history.percent.coerceIn(0f, 1f).toDouble() * total.toDouble())
          \t\t\t.toInt()
          \t\t\t.coerceIn(0, total)
          \t\treturn (total - read).coerceAtLeast(0)
          \t}
'''.replace('          ', '')
          text = text[:start] + implementation + text[end:]
          text = text.replace(
              '\t\tconst val DB_QUERY_BATCH_SIZE = 500\n',
              '\t\tconst val DB_QUERY_BATCH_SIZE = 500\n\t\tconst val DB_HISTORY_QUERY_BATCH_SIZE = 400\n',
          )
          path.write_text(text)

          # 5) Regression tests for language selection semantics.
          path = Path('app/src/test/kotlin/org/koitharu/kotatsu/settings/sources/catalog/InstalledExtensionLanguageFilterTest.kt')
          text = path.read_text()
          marker = '''\tprivate fun source(sourceId: Long, language: String) = MihonMangaSource(
'''.replace('          ', '')
          tests = '''\t@Test
          \tfun `universal package language remains eligible for a specific language`() {
          \t\tassertTrue(installedExtensionMatchesLanguage(emptyList(), "all", "ja"))
          \t}

          \t@Test
          \tfun `uninstalled multi-source entry matches every published source language`() {
          \t\tval entry = ExternalExtensionRepoEntry(
          \t\t\tname = "Multi",
          \t\t\tpackageName = "extension.multi",
          \t\t\tapkName = "multi.apk",
          \t\t\tlang = "all",
          \t\t\tversionCode = 1,
          \t\t\tversionName = "1.0",
          \t\t\tsources = listOf(
          \t\t\t\tExternalExtensionRepoSource(id = "1", name = "Japanese", lang = "ja"),
          \t\t\t\tExternalExtensionRepoSource(id = "2", name = "Chinese", lang = "zh"),
          \t\t\t),
          \t\t)

          \t\tassertTrue(extensionEntryMatchesLanguage(entry, emptyList(), "ja"))
          \t\tassertTrue(extensionEntryMatchesLanguage(entry, emptyList(), "ZH"))
          \t\t// "all" is a universal fallback for older repos whose per-source languages are unavailable.
          \t\tassertTrue(extensionEntryMatchesLanguage(entry.copy(sources = emptyList()), emptyList(), "ko"))
          \t}

'''.replace('          ', '')
          text = require_replace(text, marker, tests + marker, 'extension language regression tests')
          path.write_text(text)
          PY

      - name: Compile and run language regression test
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          git diff --check
          ./gradlew :app:testPreviewUnitTest --tests 'org.koitharu.kotatsu.settings.sources.catalog.InstalledExtensionLanguageFilterTest' --no-daemon --stacktrace

      - name: Commit verified fixes and restore helper
        if: always()
        shell: bash
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          write_manual_helper() {
            cat > .github/workflows/beta-build-once.yml <<'YAML'
          name: Beta Build Once

          # Temporary helper kept manual-only after the requested Beta build.
          on:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            beta:
              name: Build beta APK
              runs-on: ubuntu-latest
              steps:
                - name: Manual helper disabled
                  run: echo "Use preview-build.yml for normal manual Beta builds."
          YAML
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$PATCH_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
            write_manual_helper
            git add \
              .github/workflows/beta-build-once.yml \
              app/src/main/kotlin/org/koitharu/kotatsu/settings/sources/catalog/SourcesCatalogViewModel.kt \
              app/src/main/kotlin/org/koitharu/kotatsu/favourites/data/FavouritesDao.kt \
              app/src/main/kotlin/org/koitharu/kotatsu/core/db/dao/ChaptersDao.kt \
              app/src/main/kotlin/org/koitharu/kotatsu/favourites/domain/FavouriteUnreadCounter.kt \
              app/src/test/kotlin/org/koitharu/kotatsu/settings/sources/catalog/InstalledExtensionLanguageFilterTest.kt
            git diff --cached --check
            git commit -m 'Speed up favourites and restore extension languages'
            git push origin HEAD:beta
            exit 0
          fi

          git reset --hard HEAD
          write_manual_helper
          git add .github/workflows/beta-build-once.yml
          git commit -m 'Restore source fix helper after failed verification'
          git push origin HEAD:beta
          echo "Source fix verification failed; no application source changes were committed."
          exit 1
