name: Beta Build Once

on:
  push:
    branches:
      - beta

permissions:
  contents: read

concurrency:
  group: beta-build-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    name: Build beta APK once
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Require stable beta signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Beta builds require the permanent repository signing key so future Beta APKs remain update-compatible."
            exit 1
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Apply beta build version
        shell: bash
        run: |
          set -euo pipefail
          BUILD_GRADLE="app/build.gradle"
          BASE_VERSION=$(grep -E "versionName = '[^']+'" "$BUILD_GRADLE" | head -n1 | sed -E "s/.*versionName = '([^']+)'.*/\1/")
          VERSION_NAME="${BASE_VERSION}-beta.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          VERSION_CODE=$(( $(date -u +%s) / 60 ))
          export VERSION_NAME VERSION_CODE
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('app/build.gradle')
          text = path.read_text()
          version_name = os.environ['VERSION_NAME']
          version_code = os.environ['VERSION_CODE']
          text, count_name = re.subn(r"versionName = '[^']+'", f"versionName = '{version_name}'", text, count=1)
          text, count_code = re.subn(r'versionCode = \d+', f'versionCode = {version_code}', text, count=1)
          if count_name != 1 or count_code != 1:
              raise SystemExit('Could not update beta versionName/versionCode exactly once')
          path.write_text(text)
          PY
          echo "Beta version: ${VERSION_NAME} (versionCode ${VERSION_CODE})"

      - name: Pre-warm JitPack dependencies
        run: |
          PARSERS_VERSION=$(grep 'parsers = ' gradle/libs.versions.toml | sed 's/.*= "\(.*\)"/\1/')
          echo "Pre-warming JitPack for kotatsu-parsers:${PARSERS_VERSION}"
          POM_URL="https://jitpack.io/com/github/YakaTeam/kotatsu-parsers/${PARSERS_VERSION}/kotatsu-parsers-${PARSERS_VERSION}.pom"
          for i in $(seq 1 10); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$POM_URL")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "JitPack artifact is ready (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: JitPack returned HTTP ${HTTP_STATUS}, waiting 30s..."
            sleep 30
          done
          echo "::error::JitPack artifact for kotatsu-parsers:${PARSERS_VERSION} not available after 10 attempts"
          exit 1

      - name: Build beta APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assemblePreview --no-daemon --stacktrace \
            -PRELEASE_STORE_FILE=../release.keystore \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Collect APK and compute checksums
        id: apk
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/preview -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No beta APK found under app/build/outputs/apk/preview"
            exit 1
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          SAFE_REF=$(echo "${GITHUB_REF_NAME}" | tr '/ ' '__')
          DEST="DropSauce-Noirero-Beta-${SAFE_REF}-${SHORT_SHA}.apk"
          cp "$APK" "$DEST"

          SHA256=$(sha256sum "$DEST" | awk '{print $1}')
          SHA1=$(sha1sum "$DEST" | awk '{print $1}')
          MD5=$(md5sum "$DEST" | awk '{print $1}')
          SIZE=$(du -h "$DEST" | cut -f1)

          echo "apk_name=${DEST}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"

          {
            echo "**Beta build of \`${GITHUB_REF_NAME}\`**"
            echo ""
            echo "This APK uses the preview applicationId suffix and can be installed alongside DropSauce Noirero main."
            echo "All Beta builds from this workflow use the permanent repository signing key for in-place updates."
            echo "App name: \`DropSauce Noirero Beta\`"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| File | \`${DEST}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${SHORT_SHA}\` |"
            echo "| Size | ${SIZE} |"
            echo "| SHA-256 | \`${SHA256}\` |"
            echo "| SHA-1 | \`${SHA1}\` |"
            echo "| MD5 | \`${MD5}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload beta APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30
