name: Fix EPUB translation reliability

on:
  push:
    paths:
      - '.github/workflows/fix-epub-translation-progress.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch translation flow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubReaderFragment.kt')
          text = p.read_text()

          field_old = '\tprivate var translationGeneration = 0\n'
          field_new = '''\tprivate var translationGeneration = 0
\tprivate var translationStatusDialog: androidx.appcompat.app.AlertDialog? = null
\tprivate var translationTimeoutRunnable: Runnable? = null
'''
          if field_old not in text:
              raise SystemExit('translation field marker not found')
          text = text.replace(field_old, field_new, 1)

          start = text.index('\tprivate fun translateCurrentChapter(')
          end = text.index('\n\tprivate fun restoreOriginalTranslation()', start)
          replacement = r'''\tprivate fun translateCurrentChapter(sourceLanguage: String, targetLanguage: String) {
\t\tval locator = currentLocator()
\t\tval chapter = chapters.getOrNull(locator.chapter) ?: return
\t\tval original = translationOriginals[chapter.id] ?: chapter.content ?: return
\t\ttranslationOriginals.putIfAbsent(chapter.id, SpannedString(original))

\t\tcancelActiveTranslation(incrementGeneration = false)
\t\tval translator = Translation.getClient(
\t\t\tTranslatorOptions.Builder()
\t\t\t\t.setSourceLanguage(sourceLanguage)
\t\t\t\t.setTargetLanguage(targetLanguage)
\t\t\t\t.build(),
\t\t)
\t\tactiveTranslator = translator
\t\tval generation = ++translationGeneration
\t\tsetChapterLoading(true)
\t\tshowTranslationStatusDialog(generation, sourceLanguage, targetLanguage)

\t\tval timeout = Runnable {
\t\t\tif (!isAdded || generation != translationGeneration) return@Runnable
\t\t\tcancelActiveTranslation(incrementGeneration = true)
\t\t\tToast.makeText(requireContext(), R.string.epub_translate_model_timeout, Toast.LENGTH_LONG).show()
\t\t}
\t\ttranslationTimeoutRunnable = timeout
\t\tviewBinding?.root?.postDelayed(timeout, TRANSLATION_MODEL_TIMEOUT_MS)

\t\ttranslator.downloadModelIfNeeded(DownloadConditions.Builder().build())
\t\t\t.addOnSuccessListener {
\t\t\t\tif (!isAdded || generation != translationGeneration) return@addOnSuccessListener
\t\t\t\tclearTranslationTimeout()
\t\t\t\tval chunks = splitTranslationText(original.toString())
\t\t\t\tupdateTranslationStatus(getString(R.string.epub_translate_translating_progress, 0, chunks.size))
\t\t\t\ttranslateChunks(translator, chunks, 0, ArrayList(), generation) { translated, error ->
\t\t\t\t\tif (!isAdded || generation != translationGeneration) return@translateChunks
\t\t\t\t\tfinishTranslationUi()
\t\t\t\t\tif (error != null || translated == null) {
\t\t\t\t\t\tToast.makeText(requireContext(), R.string.epub_translate_failed, Toast.LENGTH_LONG).show()
\t\t\t\t\t\treturn@translateChunks
\t\t\t\t\t}
\t\t\t\t\tval beforeLength = chapter.text.length.coerceAtLeast(1)
\t\t\t\t\tchapter.content = SpannedString(translated)
\t\t\t\t\tval mappedOffset = (translated.length * (locator.offset.toDouble() / beforeLength))
\t\t\t\t\t\t.toInt().coerceIn(0, translated.length)
\t\t\t\t\trefreshReader(Locator(locator.chapter, mappedOffset))
\t\t\t\t\tToast.makeText(requireContext(), R.string.epub_translate_done, Toast.LENGTH_SHORT).show()
\t\t\t\t}
\t\t\t}
\t\t\t.addOnFailureListener { error ->
\t\t\t\tif (!isAdded || generation != translationGeneration) return@addOnFailureListener
\t\t\t\tfinishTranslationUi()
\t\t\t\tval detail = error.localizedMessage?.takeIf { it.isNotBlank() }
\t\t\t\tval message = if (detail == null) {
\t\t\t\t\tgetString(R.string.epub_translate_model_failed)
\t\t\t\t} else {
\t\t\t\t\tgetString(R.string.epub_translate_model_failed_detail, detail)
\t\t\t\t}
\t\t\t\tToast.makeText(requireContext(), message, Toast.LENGTH_LONG).show()
\t\t\t}
\t}

\tprivate fun showTranslationStatusDialog(generation: Int, sourceLanguage: String, targetLanguage: String) {
\t\ttranslationStatusDialog?.dismiss()
\t\ttranslationStatusDialog = MaterialAlertDialogBuilder(requireContext())
\t\t\t.setTitle(R.string.epub_translate_current_chapter)
\t\t\t.setMessage(
\t\t\t\tgetString(
\t\t\t\t\tR.string.epub_translate_downloading_model,
\t\t\t\t\tsourceLanguage.uppercase(),
\t\t\t\t\ttargetLanguage.uppercase(),
\t\t\t\t),
\t\t\t)
\t\t\t.setNegativeButton(android.R.string.cancel) { _, _ ->
\t\t\t\tif (generation == translationGeneration) cancelActiveTranslation(incrementGeneration = true)
\t\t\t}
\t\t\t.setCancelable(false)
\t\t\t.show()
\t}

\tprivate fun updateTranslationStatus(message: String) {
\t\ttranslationStatusDialog?.setMessage(message)
\t}

\tprivate fun clearTranslationTimeout() {
\t\ttranslationTimeoutRunnable?.let { viewBinding?.root?.removeCallbacks(it) }
\t\ttranslationTimeoutRunnable = null
\t}

\tprivate fun finishTranslationUi() {
\t\tclearTranslationTimeout()
\t\tsetChapterLoading(false)
\t\ttranslationStatusDialog?.dismiss()
\t\ttranslationStatusDialog = null
\t}

\tprivate fun cancelActiveTranslation(incrementGeneration: Boolean) {
\t\tif (incrementGeneration) translationGeneration++
\t\tclearTranslationTimeout()
\t\tactiveTranslator?.close()
\t\tactiveTranslator = null
\t\tfinishTranslationUi()
\t}
'''.replace('\\t', '\t')
          text = text[:start] + replacement + text[end:]

          success_old = '''\t\ttranslator.translate(chunks[index])
\t\t\t.addOnSuccessListener { translated ->
\t\t\t\tif (generation != translationGeneration) return@addOnSuccessListener
\t\t\t\tresult += translated
\t\t\t\ttranslateChunks(translator, chunks, index + 1, result, generation, onComplete)
'''
          success_new = '''\t\ttranslator.translate(chunks[index])
\t\t\t.addOnSuccessListener { translated ->
\t\t\t\tif (generation != translationGeneration) return@addOnSuccessListener
\t\t\t\tresult += translated
\t\t\t\tif (isAdded) updateTranslationStatus(getString(R.string.epub_translate_translating_progress, index + 1, chunks.size))
\t\t\t\ttranslateChunks(translator, chunks, index + 1, result, generation, onComplete)
'''
          if success_old not in text:
              raise SystemExit('translateChunks marker not found')
          text = text.replace(success_old, success_new, 1)

          destroy_old = '''\t\ttranslationGeneration++
\t\tactiveTranslator?.close()
\t\tactiveTranslator = null
\t\ttranslationOriginals.clear()
'''
          destroy_new = '''\t\ttranslationGeneration++
\t\tclearTranslationTimeout()
\t\ttranslationStatusDialog?.dismiss()
\t\ttranslationStatusDialog = null
\t\tactiveTranslator?.close()
\t\tactiveTranslator = null
\t\ttranslationOriginals.clear()
'''
          if destroy_old not in text:
              raise SystemExit('destroy marker not found')
          text = text.replace(destroy_old, destroy_new, 1)

          const_marker = '\tcompanion object {\n'
          const_new = '\tcompanion object {\n\t\tprivate const val TRANSLATION_MODEL_TIMEOUT_MS = 120_000L\n'
          if const_marker not in text:
              raise SystemExit('companion marker not found')
          text = text.replace(const_marker, const_new, 1)
          p.write_text(text)

          s = Path('app/src/main/res/values/strings_noirero_translate.xml')
          strings = s.read_text()
          marker = '    <string name="epub_translate_preparing">Preparing translation model…</string>\n'
          addition = '''    <string name="epub_translate_preparing">Preparing translation model…</string>
    <string name="epub_translate_downloading_model">Checking/downloading translation model %1$s → %2$s…\nThis is only required the first time.</string>
    <string name="epub_translate_translating_progress">Translating chapter… %1$d / %2$d</string>
    <string name="epub_translate_model_timeout">Translation model download timed out. Check your internet connection, Private DNS/VPN, and try again.</string>
'''
          if marker not in strings:
              raise SystemExit('string marker not found')
          strings = strings.replace(marker, addition, 1)
          failed = '    <string name="epub_translate_model_failed">Could not download the translation model.</string>\n'
          failed_new = failed + '    <string name="epub_translate_model_failed_detail">Could not download the translation model: %1$s</string>\n'
          if failed not in strings:
              raise SystemExit('failed string marker not found')
          strings = strings.replace(failed, failed_new, 1)
          s.write_text(strings)
          PY

      - name: Compile release Kotlin
        run: ./gradlew compileReleaseKotlin

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubReaderFragment.kt app/src/main/res/values/strings_noirero_translate.xml
          git rm --ignore-unmatch .github/workflows/fix-epub-translation-progress.yml
          git commit -m 'Improve EPUB translation model handling and progress'
          git push
