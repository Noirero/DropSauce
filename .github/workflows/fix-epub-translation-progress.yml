name: Fix EPUB translation reliability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-epub-translation-progress.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch translation flow
        run: python3 .github/scripts/fix_epub_translation_progress.py

      - name: Compile release Kotlin
        run: ./gradlew compileReleaseKotlin

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubReaderFragment.kt app/src/main/res/values/strings_noirero_translate.xml
          git rm --ignore-unmatch .github/workflows/fix-epub-translation-progress.yml .github/scripts/fix_epub_translation_progress.py
          git commit -m "Improve EPUB translation model handling and progress"
          git push
