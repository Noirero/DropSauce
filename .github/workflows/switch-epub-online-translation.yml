name: Switch EPUB translation to online engine

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/switch-epub-online-translation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply online translation migration
        run: python .github/scripts/switch_epub_online_translation.py

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit lightweight online translation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubReaderFragment.kt app/src/main/res/values/strings_noirero_translate.xml
          git diff --cached --quiet && exit 0
          git commit -m "Use lightweight online EPUB translation"
          git push
