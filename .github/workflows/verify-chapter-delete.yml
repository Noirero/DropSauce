name: Verify exact chapter deletion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-chapter-delete.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant Gradle permission
        run: chmod +x gradlew
      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon
