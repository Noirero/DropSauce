name: Fix EPUB translate menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-epub-translate-menu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix translation options dialog
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubReaderFragment.kt')
          text = path.read_text()
          old = '''\t\tMaterialAlertDialogBuilder(requireContext())
\t\t\t.setTitle(R.string.epub_translate_current_chapter)
\t\t\t.setMessage(R.string.epub_translate_online_note)
\t\t\t.setItems(labels) { _, which ->
'''
          new = '''\t\tMaterialAlertDialogBuilder(requireContext())
\t\t\t.setTitle(R.string.epub_translate_current_chapter)
\t\t\t.setItems(labels) { _, which ->
'''
          if old not in text:
              raise SystemExit('Translate dialog block not found')
          path.write_text(text.replace(old, new, 1))

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubReaderFragment.kt
          git commit -m "Fix EPUB translation options dialog"
          git push
