name: Apply EPUB translate tool v2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-epub-translate-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply_epub_translate.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle \
            app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/config/ReaderConfigSheet.kt \
            app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/ReaderActivity.kt \
            app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubReaderFragment.kt \
            app/src/main/res/values/strings_noirero_translate.xml \
            app/src/main/res/drawable/ic_translate_noirero.xml
          git commit -m "Add EPUB on-device translation tool"
          git push
