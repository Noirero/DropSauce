name: Beta Build

# Builds a standalone beta APK from the beta branch.
# It reuses the preview variant because that variant already has a separate applicationId suffix,
# so the APK can be installed alongside DropSauce Noirero main without replacing it.
# R8/resource shrinking is intentionally OFF for this test build.
on:
  workflow_dispatch:
  push:
    branches:
      - beta

permissions:
  contents: read

concurrency:
  group: beta-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    name: Build beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Pre-warm JitPack dependencies
        run: |
          PARSERS_VERSION=$(grep 'parsers = ' gradle/libs.versions.toml | sed 's/.*= "\(.*\)"/\1/')
          echo "Pre-warming JitPack for kotatsu-parsers:${PARSERS_VERSION}"
          POM_URL="https://jitpack.io/com/github/YakaTeam/kotatsu-parsers/${PARSERS_VERSION}/kotatsu-parsers-${PARSERS_VERSION}.pom"
          for i in $(seq 1 10); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$POM_URL")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "JitPack artifact is ready (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: JitPack returned HTTP ${HTTP_STATUS}, waiting 30s..."
            sleep 30
          done
          echo "::error::JitPack artifact for kotatsu-parsers:${PARSERS_VERSION} not available after 10 attempts"
          exit 1

      - name: Build beta APK
        run: ./gradlew :app:assemblePreview --no-daemon --stacktrace

      - name: Collect APK and compute checksums
        id: apk
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/preview -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No beta APK found under app/build/outputs/apk/preview"
            exit 1
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          SAFE_REF=$(echo "${GITHUB_REF_NAME}" | tr '/ ' '__')
          DEST="DropSauce-Noirero-Beta-${SAFE_REF}-${SHORT_SHA}.apk"
          cp "$APK" "$DEST"

          SHA256=$(sha256sum "$DEST" | awk '{print $1}')
          SHA1=$(sha1sum "$DEST" | awk '{print $1}')
          MD5=$(md5sum "$DEST" | awk '{print $1}')
          SIZE=$(du -h "$DEST" | cut -f1)

          echo "apk_name=${DEST}" >> "$GITHUB_OUTPUT"

          {
            echo "**Beta build of \`${GITHUB_REF_NAME}\`**"
            echo ""
            echo "This APK uses the preview applicationId suffix and can be installed alongside DropSauce Noirero main."
            echo "App name: \`DropSauce Noirero Beta\`"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| File | \`${DEST}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${SHORT_SHA}\` |"
            echo "| Size | ${SIZE} |"
            echo "| SHA-256 | \`${SHA256}\` |"
            echo "| SHA-1 | \`${SHA1}\` |"
            echo "| MD5 | \`${MD5}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload beta APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30
