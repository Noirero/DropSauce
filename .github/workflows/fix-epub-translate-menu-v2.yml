name: Fix EPUB translate menu v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-epub-translate-menu-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove conflicting dialog message
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubReaderFragment.kt')
          text = path.read_text()
          needle = '\t\t\t.setMessage(R.string.epub_translate_online_note)\n'
          if needle not in text:
              raise SystemExit('Expected translate dialog message was not found')
          path.write_text(text.replace(needle, '', 1))
          PY

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubReaderFragment.kt
          git diff --cached --quiet && exit 0
          git commit -m 'Fix EPUB translation options dialog'
          git push
