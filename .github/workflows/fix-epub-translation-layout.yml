name: Fix EPUB translation paragraph layout

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-epub-translation-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show EPUB translation options
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubReaderFragment.kt')
          text = path.read_text()
          needle = '\t\t\t.setMessage(R.string.epub_translate_online_note)\n'
          if needle not in text:
              raise SystemExit('Expected online translation dialog message was not found')
          path.write_text(text.replace(needle, '', 1))

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/org/koitharu/kotatsu/reader/ui/epub/EpubReaderFragment.kt
          git commit -m "Fix EPUB translation options dialog"
          git push
