name: Verify EPUB translate

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-epub-translate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Compile release Kotlin
        run: ./gradlew compileReleaseKotlin --no-daemon --stacktrace

